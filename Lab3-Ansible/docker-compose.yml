version: '3.8'

services:
  ansible-master:
    build:
      context: .
      dockerfile: ./dockerfile.master
    container_name: ansible-master
    ports:
      - "4444:22"
    volumes:
      - ./ansible:/home/admin/ansible
      - ./app:/home/admin/app
    working_dir: /home/admin/ansible
    tty: true
    stdin_open: true

  ubuntu-server:
    build:
      context: .
      dockerfile: ./dockerfile.ubuntu
    container_name: ubuntu-server
    ports:
      - "8080:80"
      - "2222:22"
    tty: true
    stdin_open: true
  app:
    build:
      context: .
      dockerfile: ./dockerfile.python
    container_name: python-app
    volumes: 
      - ./app:/home/app
    ports:
      - "6666:22"
    tty: true
    stdin_open: true

