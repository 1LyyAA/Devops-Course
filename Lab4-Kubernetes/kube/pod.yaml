apiVersion: v1
kind: Pod
metadata:
  name: urlshortener-pod
  labels:
    app: urlshortener
spec:
  containers:
  - image: daylak/urlshortener
    name: urlshortener
    ports:
    - containerPort: 8080
    env:
      - name: DB_HOST
        value: postgres
      - name: DB_PORT
        value: "5432"
      - name: DB_USER
        value: admin
      - name: DB_PASSWORD
        value: admin
      - name: DB_NAME
        value: db
