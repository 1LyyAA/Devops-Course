services:
  app:
    image: daylak/app
    stdin_open: true    
    tty: true     
     
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=pg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
volumes:
  postgres_data: